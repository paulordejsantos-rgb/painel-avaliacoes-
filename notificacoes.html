<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notificações — A Casa & Designer</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="assets/images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/images/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Painel A&D">

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0d0d0d; --card:#161616; --border:#2a2a2a; --gold:#C9A84C;
    --txt:#F0EDE8; --muted:#999;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;width:100%;max-width:360px;}
  .login-box h1{font-size:20px;color:var(--gold);margin:0 0 4px;text-align:center;}
  .login-box p{font-size:13px;color:var(--muted);margin:0 0 24px;text-align:center;}
  .login-box input{width:100%;padding:12px 14px;margin-bottom:12px;border-radius:10px;border:1px solid var(--border);background:#000;color:var(--txt);font-size:14px;}
  .login-box button{width:100%;padding:12px;border-radius:10px;border:none;background:var(--gold);color:#000;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;}
  .login-box button:disabled{opacity:0.5;cursor:not-allowed;}
  .login-err{color:#e35b5b;font-size:13px;margin-top:10px;text-align:center;min-height:16px;}

  .app{display:none;}
  .app.show{display:block;}
  header.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;flex-wrap:wrap;gap:10px;}
  header.top h1{font-size:18px;color:var(--gold);margin:0;}
  header.top .nav-links{display:flex;gap:14px;font-size:13px;}
  header.top .nav-links a{color:var(--muted);text-decoration:none;}
  header.top .nav-links a.active{color:var(--gold);font-weight:700;}
  header.top button{background:transparent;border:1px solid var(--border);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;}

  .main{max-width:900px;margin:0 auto;padding:28px 20px 60px;}
  .main-intro{margin:0 0 22px;}
  .main-intro h2{font-size:22px;margin:0 0 6px;color:var(--txt);}
  .main-intro p{font-size:13px;color:var(--muted);margin:0;}

  .lista{display:flex;flex-direction:column;gap:10px;}
  .notif-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;}
  .notif-icone{width:38px;height:38px;border-radius:10px;background:rgba(201,168,76,0.12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .notif-corpo{flex:1;min-width:0;}
  .notif-titulo{font-weight:700;font-size:14px;color:var(--txt);margin:0 0 4px;}
  .notif-mensagem{font-size:13px;color:var(--muted);margin:0 0 6px;word-break:break-word;}
  .notif-rodape{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);}
  .notif-link{color:var(--gold);text-decoration:none;}
  .notif-link:hover{text-decoration:underline;}
  .loading{padding:40px;text-align:center;color:var(--muted);}
  .empty{padding:40px;text-align:center;color:var(--muted);}
</style>
<link rel="stylesheet" href="assets/css/vivo.css">
</head>
<body>

  <div class="login-wrap" id="login-wrap">
    <div class="login-box">
      <h1>Notificações</h1>
      <p>A Casa & Designer</p>
      <input type="email" id="login-email" placeholder="E-mail" autocomplete="username">
      <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password">
      <button id="login-btn" onclick="fazerLogin()">Entrar</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>

  <div class="app" id="app">
    <header class="top">
      <h1>🔔 Notificações</h1>
      <div class="nav-links">
        <a href="index.html">Avaliações</a>
        <a href="crm.html">CRM</a>
        <a href="financeiro.html">Financeiro</a>
        <a href="leads.html">Leads</a>
        <a href="instalacao.html">Instalação</a>
        <a href="documentos.html">Documentos</a>
        <a href="central.html">Central</a>
        <a href="notificacoes.html" class="active">Notificações</a>
        <a href="whatsapp.html">WhatsApp</a>
        <a href="manual.html">Manual</a>
      </div>
      <button onclick="fazerLogout()">Sair</button>
    </header>

    <div class="main">
      <div class="main-intro">
        <h2>Notificações</h2>
        <p>Avisos automáticos do painel — novos contatos e pedidos recebidos pelo WhatsApp, mais recentes primeiro.</p>
      </div>

      <div class="lista" id="lista">
        <div class="loading">Carregando...</div>
      </div>
    </div>
  </div>

<script>
const SUPABASE_URL = 'https://chwxepwdsyspcdkalaic.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNod3hlcHdkc3lzcGNka2FsYWljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NjUxOTksImV4cCI6MjA5MjA0MTE5OX0.sCcGeN9AxTBTNDMlOia2JPJR-HRxo2vQDHB6ojhbXWk';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function fazerLogin(){
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.textContent = '';
  if(!email || !senha){ err.textContent = 'Preencha e-mail e senha.'; return; }
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  btn.disabled = false;
  btn.textContent = 'Entrar';
  if(error){ err.textContent = 'E-mail ou senha inválidos.'; return; }
  mostrarApp();
}

async function fazerLogout(){
  await sb.auth.signOut();
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('login-email').value = '';
  document.getElementById('login-senha').value = '';
}

const SLUG_POR_RESTAURANTE = {
  'Pizzaria Premium': 'pizzaria-premium',
  'The Burger Foundry': 'burger-foundry',
  'Bistrô Elegante': 'bistro-elegante',
  'Peso & Sabor': 'peso-e-sabor'
};

async function redirecionarSeRestaurante(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return false;
  const { data } = await sb.from('perfis_restaurante').select('restaurante').eq('user_id', user.id).maybeSingle();
  if(data && data.restaurante && SLUG_POR_RESTAURANTE[data.restaurante]){
    window.location.href = '/' + SLUG_POR_RESTAURANTE[data.restaurante] + '/';
    return true;
  }
  return false;
}

async function aplicarRestricaoColaborador(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user) return;
  const { data: admin } = await sb.from('admins').select('user_id').eq('user_id', user.id).maybeSingle();
  if(admin) return;
  const { data: colaborador } = await sb.from('colaboradores').select('user_id').eq('user_id', user.id).maybeSingle();
  if(!colaborador) return;
  document.querySelectorAll('.nav-links a[href="crm.html"], .nav-links a[href="financeiro.html"]').forEach(function(el){ el.remove(); });
}

const ICONE_POR_TIPO = {
  whatsapp_novo_contato: '💬',
  whatsapp_suporte: '🛠️',
  whatsapp_falar_paulo: '📞',
  whatsapp_mensagem: '✉️'
};

function formatarQuando(iso){
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
}

function renderLista(notificacoes){
  const lista = document.getElementById('lista');
  if(!notificacoes.length){
    lista.innerHTML = '<div class="empty">Nenhuma notificação ainda.</div>';
    return;
  }
  lista.innerHTML = notificacoes.map(function(n){
    const icone = ICONE_POR_TIPO[n.tipo] || '🔔';
    const linkLead = n.lead_id
      ? '<a class="notif-link" href="leads.html">Ver em Leads ↗</a>'
      : '';
    return '<div class="notif-card">' +
      '<div class="notif-icone">' + icone + '</div>' +
      '<div class="notif-corpo">' +
        '<p class="notif-titulo">' + esc(n.titulo) + '</p>' +
        (n.mensagem ? '<p class="notif-mensagem">' + esc(n.mensagem) + '</p>' : '') +
        '<div class="notif-rodape"><span>' + formatarQuando(n.criado_em) + '</span>' + linkLead + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}

async function carregarNotificacoes(){
  const { data, error } = await sb
    .from('notificacoes')
    .select('*')
    .order('criado_em', { ascending: false })
    .limit(200);
  if(error){
    document.getElementById('lista').innerHTML = '<div class="empty">Não foi possível carregar as notificações.</div>';
    return;
  }
  renderLista(data || []);
  // Marca "visto agora" para zerar o sino em todas as telas deste navegador.
  localStorage.setItem('notif_ultima_vista', new Date().toISOString());
}

async function mostrarApp(){
  if(await redirecionarSeRestaurante()) return;
  await aplicarRestricaoColaborador();
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('app').classList.add('show');
  await carregarNotificacoes();
}

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ mostrarApp(); }
})();

document.getElementById('login-senha').addEventListener('keydown', e => {
  if(e.key === 'Enter') fazerLogin();
});
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(err){
      console.warn('Falha ao registrar service worker:', err);
    });
  });
}
</script>
<script src="assets/js/vivo.js" defer></script>
</body>
</html>
